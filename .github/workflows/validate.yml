name: Validate synthetic archive
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  offline:
    runs-on: windows-latest
    strategy:
      matrix:
        python: ['3.13', '3.14']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Test archival behavior
        run: python -m unittest discover -s tests -v
      - name: Check synthetic examples and frozen files
        run: python scripts/check_public_content.py
